<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Dashboard - Ciência de Dados</title>
    <style>
        /* CSS BASE - ESTE É O BLOCO QUE ELES VÃO ALTERAR NA BRANCH */
        :root {
        font-size: 62.5%;

        --body-color: #ededed;
        --bg-color: #ffffff;
        --second-color: #e9ecef;
        --text-color: #000000;
        --secondtx-color: #212121;
        --title-color: rgb(53, 136, 239);
        --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.562);

        --highlight-color: rgba(0, 0, 0, 0.25);
        --switch-bg-url: url("./img/sun.svg");

        --button-text-color-hover: #000000;
        --stroke-color: rgba(0, 0, 0, 0.5);
        --surface-color: rgba(0, 0, 0, 0.1);
        --surface-color-hover: rgba(3, 0, 0, 0.308);
        }

        .dark {

        --body-color: #262626;
        --bg-color: #000000;
        --second-color: #303031;
        --text-color: #ffffff;
        --secondtx-color: #b8b8b8;
        --title-color: rgb(124, 26, 228);
        --box-shadow: 0 4px 20px rgba(255, 255, 255, 0.562);

        --highlight-color: rgba(255, 255, 255, 0.2);
        --switch-bg-url: url("./img/moon-star.svg");
        
        --button-text-color-hover: #ffffff;
        --stroke-color: rgba(255, 255, 255, 0.5);
        --surface-color: rgba(255, 255, 255, 0.1);
        --surface-color-hover: rgba(3, 0, 0, 0.308);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--body-color); /* Cor para alterar no modo noturno */
            color: #333;               /* Cor para alterar no modo noturno */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .dashboard-container {
            background-color: var(--bg-color); /* Cor para alterar no modo noturno */
            padding: 30px;
            border-radius: 12px;
            box-shadow: var(--box-shadow);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: var(--title-color);
            margin-bottom: 20px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .card {
            background: var(--second-color);
            padding: 15px;
            border-radius: 8px;
        }

        .card-value {
            font-size: 24px;
            font-weight: bold;
            display: block;
            color: var(--text-color);
        }

        .card-label {
            font-size: 14px;
            color: var(--secondtx-color);
        }

        .online {
            display: inline-block;
            animation: pulse 1s infinite;
            text-shadow: rgb(0, 128, 0) 0px 0px 5px;
        }

        /* switch */
        #switch {
        position: absolute;
        width: 4rem;
        margin-left: 1450px;
        margin-bottom: 600px;
        }

        #switch button {
        position: absolute;
        z-index: 1;
        transform: translateY(-50%);
        top: 50%;
        left: 0;
        cursor: pointer;
        
        width: 2.5rem;
        height: 2.5rem;
        background: white;
        border: 0;
        border-radius: 50%;
        background-image: var(--switch-bg-url);
        background-repeat: no-repeat;
        background-position: center;
        transition: all 0.3s;
        
        animation: slide-back 0.4s;
        border: 1px var(--highlight-color) solid;
        }

        #switch button:hover {
        outline: 0.5rem solid var(--highlight-color);
        }

        .dark #switch button {
        animation: slide-in 0.4s forwards;
        }

        #switch span {
        display: block;
        width: 4rem;
        height: 1.7rem;
        background: var(--surface-color);
        border: 1px solid var(--stroke-color);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border-radius: 624.94rem;
        }
         /* Animações do modo escuro  */
        @keyframes slide-in {
        from { left: 0; }
        to { left: 50%; }
        }

        @keyframes slide-back {
        from { left: 50%; }
        to { left: 0; }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1); /* Tamanho original */
                text-shadow: rgb(0, 128, 0) 0px 0px 5px;
            }
            50% {
                transform: scale(1.15); /* Dobro do tamanho */
                text-shadow: rgb(1, 185, 1) 0px 0px 5px;
            }
        }

    </style>
</head>
<body>

    <div id="switch" onclick="toggleMode()">
        <button></button>
        <span></span>
    </div>

    <div class="dashboard-container">
        <h1>Dashboard Analítico</h1>
        
        <div class="metrics-grid">
            <div class="card">
                <span class="card-value">94.2%</span>
                <span class="card-label">Acurácia</span>
            </div>
            <div class="card">
                <span class="card-value">1.2s</span>
                <span class="card-label">Latência</span>
            </div>
        </div>

        <p style="margin-top: 25px; font-size: 12px; color: #999;">
            Status do Servidor: <span style="color: green;" class="online"> ● Online</span>
        </p>
    </div>

</body>
</html>
<script>

function toggleMode(){
    const html = document.documentElement;
    html.classList.toggle('dark');


    // Salva o tema escolhido no "Armazenamento Local (LocalStorage)"
    const mode = html.classList.contains('dark') ? 'dark' : 'light';
    localStorage.setItem('theme', mode);

    // Alterar aparência do título
    updateTextColor();
}
function updateTextColor(){
    currentColor = document.documentElement.classList.contains('dark') ? '#fff' : 'black';
    titleElement.style.color = currentColor;
}

</script>
